; PlatformIO Configuration File for ESP32 RFID Access Control
; Board: ESP32 38-Pin Dev Module
; Ethernet: W5500 (SPI)
; RFID: MFRC522 (SPI)
; Display: 16x2 Character LCD + PCF8574 I2C Backpack (Address: 0x27, SDA=21, SCL=22)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; File System Configuration (LittleFS)
board_build.filesystem = littlefs

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    miguelbalboa/MFRC522 @ ^1.4.10
    arduino-libraries/Ethernet @ ^2.0.2
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4